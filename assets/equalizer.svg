<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="animated equalizer">
  <style>
    .bar {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: bounce 1.05s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      0%   { transform: scaleY(.12); opacity: .55; }
      100% { transform: scaleY(1);   opacity: 1;   }
    }
    .hue { fill: #7C3AED; }
    @media (prefers-color-scheme: light) { .hue { fill: #6D28D9; } }

    .mirror { transform-box: fill-box; transform-origin: center top; animation: bounce 1.05s ease-in-out infinite alternate; opacity: .18; }

    .glowline { stroke: #22D3EE; stroke-width: 1; stroke-opacity: .35; stroke-dasharray: 2 10;
                animation: flow 2.5s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -48; } }
  </style>

  <line class="glowline" x1="20" y1="100" x2="620" y2="100"/>

  <g transform="translate(60 100)">
    <g><rect class="bar hue"   x="0"  y="-88" width="10" height="88" rx="5" style="animation-delay:0s"/>   <rect class="mirror hue" x="0"  y="0" width="10" height="88" rx="5" style="animation-delay:0s"/></g>
    <g transform="translate(26 0)"><rect class="bar hue"   x="0" y="-88" width="10" height="88" rx="5" style="animation-delay:.08s"/>  <rect class="mirror hue" x="0" y="0" width="10" height="88" rx="5" style="animation-delay:.08s"/></g>
    <g transform="translate(52 0)"><rect class="bar hue"   x="0" y="-88" width="10" height="88" rx="5" style="animation-delay:.16s"/>  <rect class="mirror hue" x="0" y="0" width="10" height="88" rx="5" style="animation-delay:.16s"/></g>
    <g transform="translate(78 0)"><rect class="bar hue"   x="0" y="-88" width="10" height="88" rx="5" style="animation-delay:.24s"/>  <rect class="mirror hue" x="0" y="0" width="10" height="88" rx="5" style="animation-delay:.24s"/></g>
    <g transform="translate(104 0)"><rect class="bar hue" x="0" y="-88" width="10" height="88" rx="5" style="animation-delay:.32s"/> <rect class="mirror hue" x="0" y="0" width="10" height="88" rx="5" style="animation-delay:.32s"/></g>
    <g transform="translate(130 0)"><rect class="bar hue" x="0" y="-88" width="10" height="88" rx="5" style="animation-delay:.4s"/>  <rect class="mirror hue" x="0" y="0" width="10" height="88" rx="5" style="animation-delay:.4s"/></g>
    <g transform="translate(156 0)"><rect class="bar hue" x="0" y="-88" width="10" height="88" rx="5" style="animation-delay:.48s"/> <rect class="mirror hue" x="0" y="0" width="10" height="88" rx="5" style="animation-delay:.48s"/></g>
    <g transform="translate(182 0)"><rect class="bar hue" x="0" y="-88" width="10" height="88" rx="5" style="animation-delay:.56s"/> <rect class="mirror hue" x="0" y="0" width="10" height="88" rx="5" style="animation-delay:.56s"/></g>
