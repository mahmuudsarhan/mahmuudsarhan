    <g transform="translate(338 0)"><rect class="bar hue" x="0" y="-88" width="10" height="88" rx="5" style="animation-delay:1.04s"/> <rect class="mirror hue" x="0" y="0" width="10" height="88" rx="5" style="animation-delay:1.04s"/></g>
    <g transform="translate(364 0)"><rect class="bar hue" x="0" y="-88" width="10" height="88" rx="5" style="animation-delay:1.12s"/> <rect class="mirror hue" x="0" y="0" width="10" height="88" rx="5" style="animation-delay:1.12s"/></g>
