    <g transform="translate(520 0)"><rect class="bar hue" x="0" y="-88" width="10" height="88" rx="5" style="animation-delay:1.6s"/>  <rect class="mirror hue" x="0" y="0" width="10" height="88" rx="5" style="animation-delay:1.6s"/></g>
  </g>
</svg>