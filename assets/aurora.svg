<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="animated aurora">
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <radialGradient id="blobA">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC">
      <stop offset="0%"   stop-color="#F472B6" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#F472B6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobD">
      <stop offset="0%"   stop-color="#FACC15" stop-opacity="0.8"/>
      <stop offset="60%"  stop-color="#FACC15" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .blob {
      transform-box: fill-box;
      transform-origin: center;
      mix-blend-mode: screen;
      will-change: transform, opacity;
    }
    .a { animation: driftA 17s ease-in-out infinite alternate; }
    .b { animation: driftB 21s ease-in-out infinite alternate; }
    .c { animation: driftC 13s ease-in-out infinite alternate; }
    .d { animation: driftD 25s ease-in-out infinite alternate; }

    @keyframes driftA {
      0%   { transform: translate(-140px,  40px) scale(1);    opacity: .85; }
      50%  { transform: translate(  90px, -70px) scale(1.25); opacity: 1;   }
      100% { transform: translate( 210px,  60px) scale(.9);  opacity: .7;  }
    }
    @keyframes driftB {
      0%   { transform: translate( 160px,  90px) scale(1.1);  opacity: .7; }
      50%  { transform: translate( -70px, -60px) scale(.85); opacity: 1;   }
      100% { transform: translate(-190px,  50px) scale(1.2); opacity: .8;  }
    }
    @keyframes driftC {
      0%   { transform: translate( -40px, 110px) scale(.95); opacity: .75; }
      50%  { transform: translate( 120px, -30px) scale(1.3); opacity: 1;   }
      100% { transform: translate(  30px, -120px) scale(1);  opacity: .65; }
    }
    @keyframes driftD {
      0%   { transform: translate( 60px, -90px) scale(1);   opacity: .6; }
      100% { transform: translate(-120px, 100px) scale(1.4); opacity: 1; }
    }

    .scan { animation: scan 6s linear infinite; }
    @keyframes scan {
      0%   { transform: translateX(-30%); opacity: 0; }
      15%  { opacity: .9; }
      85%  { opacity: .9; }
      100% { transform: translateX(130%); opacity: 0; }
    }

    .grid-line { stroke: #ffffff; stroke-opacity: .10; stroke-width: 1; }
    @media (prefers-color-scheme: light) {
      .grid-line { stroke: #0f172a; stroke-opacity: .10; }
    }
  </style>

  <!-- faint graph-paper grid -->
  <g>
    <line class="grid-line" x1="0" y1="70"  x2="1200" y2="70"/>
    <line class="grid-line" x1="0" y1="140" x2="1200" y2="140"/>
    <line class="grid-line" x1="0" y1="210" x2="1200" y2="210"/>
    <line class="grid-line" x1="0" y1="280" x2="1200" y2="280"/>
    <line class="grid-line" x1="0" y1="350" x2="1200" y2="350"/>
    <line class="grid-line" x1="100" y1="0" x2="100"  y2="420"/>
    <line class="grid-line" x1="300" y1="0" x2="300"  y2="420"/>
    <line class="grid-line" x1="500" y1="0" x2="500"  y2="420"/>
    <line class="grid-line" x1="700" y1="0" x2="700"  y2="420"/>
    <line class="grid-line" x1="900" y1="0" x2="900"  y2="420"/>
    <line class="grid-line" x1="1100" y1="0" x2="1100" y2="420"/>
  </g>

  <!-- drifting colour clouds -->
  <g filter="url(#soft)">
    <circle class="blob a" cx="260"  cy="150" r="190" fill="url(#blobA)"/>
    <circle class="blob b" cx="760"  cy="260" r="210" fill="url(#blobB)"/>
    <circle class="blob c" cx="520"  cy="120" r="170" fill="url(#blobC)"/>
    <circle class="blob d" cx="980"  cy="180" r="150" fill="url(#blobD)"/>
  </g>

  <!-- light sweep -->
  <rect class="scan" x="0" y="0" width="340" height="420" fill="url(#sheen)" opacity="0.35"/>
</svg>