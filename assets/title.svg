<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="animated neon title">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE"/>
      <stop offset="25%"  stop-color="#7C3AED"/>
      <stop offset="50%"  stop-color="#F472B6"/>
      <stop offset="75%"  stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="f" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font: 800 64px "Segoe UI", system-ui, -apple-system, sans-serif;
      letter-spacing: 6px;
      fill: url(#neon);
      animation: hue 6s linear infinite, flicker 5s ease-in-out infinite;
    }
    @keyframes hue  { to { filter: hue-rotate(360deg); } }
    @keyframes flicker {
      0%, 100%   { opacity: 1; }
      47%        { opacity: 1; }
      48%        { opacity: .55; }
      49%        { opacity: 1; }
      50.5%      { opacity: .35; }
      51.5%      { opacity: 1; }
      86%        { opacity: 1; }
      86.5%      { opacity: .5; }
      87.2%      { opacity: 1; }
    }

    .sub { font: 500 20px ui-monospace, Menlo, monospace; letter-spacing: 5px; fill: #ffffff; fill-opacity: .55; }
    @media (prefers-color-scheme: light) { .sub { fill: #0f172a; fill-opacity: .55; } }

    .cursor { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .spark { animation: rise 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes rise {
      0%   { transform: translateY(10px) scale(.6); opacity: 0; }
      40%  { opacity: 1; }
      100% { transform: translateY(-24px) scale(1); opacity: 0; }
    }
  </style>

  <text class="title" x="450" y="120" text-anchor="middle" filter="url(#f)">ANIMATED</text>
  <text class="title" x="450" y="190" text-anchor="middle" filter="url(#f)">README</text>
  <rect class="cursor" x="592" y="150" width="12" height="42" rx="3" fill="#22D3EE"/>

  <text class="sub" x="450" y="212" text-anchor="middle">— pure svg / css / smil —</text>

  <g fill="#FACC15">
    <circle class="spark" cx="250" cy="130" r="2.5" style="animation-delay:0s"/>
    <circle class="spark" cx="330" cy="150" r="2"   style="animation-delay:.4s"/>
    <circle class="spark" cx="600" cy="120" r="2"   style="animation-delay:.8s"/>
    <circle class="spark" cx="672" cy="140" r="2.5" style="animation-delay:1.2s"/>
    <circle class="spark" cx="730" cy="160" r="1.8" style="animation-delay:1.6s"/>
  </g>
</svg>